<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SoundBoard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="images/aula_midi.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/estilos.css">

</head>
<body>

    <h2>Sorteio com Som</h2>

    

<button onclick="tocarESortear()"><img src="images/piao.gif"></button>

<div id="resultado"></div>

<audio id="som" src="sounds/piao.mp3"></audio>

<script>

const frases = [
"💃🕺 Dance uma música até o chão 🔥🎶",
"⏭️😏 Passe a vez e finja que nada aconteceu 🤷‍♂️🍻",
"🥃⚡ Beba um shot sem pensar duas vezes 😈",
"🍻🚫😱 Todos bebem menos você (olha a pressão 👀🔥)",
"🥃🥃💀 Beba em dobro porque hoje não tem freio 🚀",
"🙌🥃🚫 Beba sem usar as mãos (se vira 😂🔥)",
"🥃🔄😵 Beba e gire mais uma vez até perder o eixo 🌪️",
"👉😈🥃 Escolha um amigo para beber e encare ele 👀",
"❤️🔥😳 Declare amor para a pessoa à sua direita com intensidade de novela 🎭",
"👕😏🔄 Troque uma peça de roupa com a pessoa à sua esquerda AGORA 😈",
"🥃👯‍♂️🔥 Beba um shot em dupla e gritem juntos 🎉",
"🎤😂🔤 Cante na língua do P com performance dramática 🎶",
"👀⏳🔥 Encare a pessoa da frente sem piscar por 60 segundos (quem rir bebe 😈)",
"👉🥃💃 Escolha alguém pra servir um shot no estilo tequileira com direito a show 🎉🔥"
];

    function tocarESortear() {
        const audio = document.getElementById("som");
        
        // Toca o som
        document.getElementById("resultado").textContent = null;
        audio.currentTime = 0;
        audio.play();

        // Para o som após 3 segundos
        setTimeout(() => {
            audio.pause();

            // Sorteia a frase
            const sorteio = frases[Math.floor(Math.random() * frases.length)];
            document.getElementById("resultado").textContent = sorteio;

        }, 5000); // 5000 ms = 5 segundos
    }
</script>

    
<h1><div id="resultado"></div></h1>





</body>
</html>
